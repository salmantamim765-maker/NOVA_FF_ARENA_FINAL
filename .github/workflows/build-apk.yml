
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q NOVA_FF_ARENA_PERFECT_BUILD_FIXED.zip
          cp -r NOVA_FF_ARENA_FINAL/. .
          rm -rf NOVA_FF_ARENA_FINAL

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Fix Android Gradle compatibility
        run: |
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096M" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          - name: Fix Flutter Maven repository
          run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/build.gradle")
          s = p.read_text()
          repo = 'maven { url uri(System.getenv("FLUTTER_ROOT") + "/bin/cache/artifacts/engine") }'
          if repo not in s:
          s = s.replace("repositories {", "repositories {\n        " + repo, 1)
          p.write_text(s)
          PY
           
      
          - name: Install dependencies
           run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ff-arena-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
