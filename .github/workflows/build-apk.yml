name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          if [ -f "NOVA_FF_ARENA_READY_TO_BUILD.zip" ]; then
            unzip -q -o NOVA_FF_ARENA_READY_TO_BUILD.zip -d _project
          elif [ -f "NOVA_FF_ARENA_PERFECT_BUILD_FIXED.zip" ]; then
            unzip -q -o NOVA_FF_ARENA_PERFECT_BUILD_FIXED.zip -d _project
          else
            echo "No project ZIP found"
            ls -la
            exit 1
          fi
          if [ -d "_project/NOVA_FF_ARENA_FINAL" ]; then
            cp -a _project/NOVA_FF_ARENA_FINAL/. .
          else
            cp -a _project/. .
          fi
          rm -rf _project
          test -f pubspec.yaml || { echo "pubspec.yaml missing"; ls -la; exit 1; }
          echo "Project extracted OK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Ensure Android platform
        run: |
          flutter create . --platforms=android --project-name nova_ff_arena --org com.novaffarena || true

      - name: Configure Gradle
        run: |
          mkdir -p android
          touch android/gradle.properties
          grep -q "android.useAndroidX" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
          grep -q "android.enableJetifier" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties
          grep -q "org.gradle.jvmargs" android/gradle.properties || echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ff-arena-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
