name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q NOVA_FF_ARENA_FIXED.zip
          cp -r NOVA_FF_ARENA_FINAL/. .
          rm -rf NOVA_FF_ARENA_FINAL

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ff-arena-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
